<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call Astro - Captured Leads Dashboard</title>
  <link rel="icon" type="image/png" href="https://www.call-astro.com/public/images/Frame%208496.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --primary: #1A2E51;
      --gold: #EEB100;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); padding: 24px 16px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img { height: 42px; }
    .brand h1 { font-size: 20px; font-weight: 800; color: var(--primary); }
    
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .stat-card span { font-size: 13px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 6px; }
    .stat-card strong { font-size: 26px; font-weight: 800; color: var(--primary); }
    
    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .search-input { padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; width: 280px; font-family: inherit; font-size: 14px; }
    .btn-group { display: flex; gap: 8px; }
    .btn { padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: #10B981; color: #fff; }
    .btn-danger { background: #FEE2E2; color: #DC2626; }
    
    .table-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.04); }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { background: #F1F5F9; padding: 12px 16px; font-weight: 700; color: var(--primary); border-bottom: 1px solid var(--border); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    tr:hover { background: #F8FAFC; }
    .badge-paid { background: #DCFCE7; color: #15803D; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge-pending { background: #F3F4F6; color: #6B7280; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .call-btn { background: #EFF6FF; color: #2563EB; padding: 4px 10px; border-radius: 6px; text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
    .call-btn:hover { background: #DBEAFE; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <a href="index.html"><img src="https://www.call-astro.com/public/images/Call-astro-logo.webp" alt="Call Astro"></a>
        <h1>Vastu Funnel Lead Dashboard</h1>
      </div>
      <div>
        <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Back to Landing Page</a>
      </div>
    </header>

    <div class="stats-row">
      <div class="stat-card">
        <span>Total Captured Leads</span>
        <strong id="statTotalLeads">0</strong>
      </div>
      <div class="stat-card">
        <span>₹9 Payments Closed</span>
        <strong id="statPaidLeads" style="color: #10B981;">0</strong>
      </div>
      <div class="stat-card">
        <span>Conversion Rate</span>
        <strong id="statConvRate">0%</strong>
      </div>
    </div>

    <div class="actions-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name, phone or email..." />
      <div class="btn-group">
        <button class="btn btn-success" onclick="exportCSV()"><i class="fa-solid fa-file-csv"></i> Download CSV</button>
        <button class="btn btn-primary" onclick="copyJSON()"><i class="fa-solid fa-copy"></i> Copy Leads JSON</button>
        <button class="btn btn-danger" onclick="clearLeads()"><i class="fa-solid fa-trash"></i> Clear All</button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Property Type</th>
              <th>Vastu Score</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="leadsTableBody">
            <tr>
              <td colspan="8" style="text-align: center; padding: 28px;">No leads recorded yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'callastro_vastu_leads_v1';
    let allLeads = [];

    function loadLeads() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        allLeads = raw ? JSON.parse(raw) : [];
      } catch (e) {
        allLeads = [];
      }
      renderStats();
      renderTable(allLeads);
    }

    function renderStats() {
      const total = allLeads.length;
      const paid = allLeads.filter(l => l.paid).length;
      const rate = total > 0 ? Math.round((paid / total) * 100) : 0;

      document.getElementById('statTotalLeads').textContent = total;
      document.getElementById('statPaidLeads').textContent = paid;
      document.getElementById('statConvRate').textContent = rate + '%';
    }

    function renderTable(list) {
      const tbody = document.getElementById('leadsTableBody');
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 28px; color: #64748B;">No leads found.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(l => `
        <tr>
          <td>${l.timestamp || '-'}</td>
          <td><strong>${l.name || '-'}</strong></td>
          <td><a href="tel:${l.mobile}" class="call-btn"><i class="fa-solid fa-phone"></i> +91 ${l.mobile || '-'}</a></td>
          <td>${l.email || '-'}</td>
          <td>${l.propertyType || '-'}</td>
          <td><strong style="color: ${l.totalScore < 60 ? '#EF4444' : '#F59E0B'}">${l.totalScore || '-'} / 100</strong></td>
          <td>${l.paid ? '<span class="badge-paid">Paid ₹9</span>' : '<span class="badge-pending">Lead Captured</span>'}</td>
          <td>
            <a href="https://wa.me/91${l.mobile}?text=Hello%20${encodeURIComponent(l.name || 'Friend')},%20this%20is%20Call%20Astro%20Vastu%20Team." target="_blank" class="call-btn" style="background:#DCFCE7; color:#15803D;">
              <i class="fa-brands fa-whatsapp"></i> Chat
            </a>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      const filtered = allLeads.filter(l => 
        (l.name && l.name.toLowerCase().includes(term)) ||
        (l.mobile && l.mobile.includes(term)) ||
        (l.email && l.email.toLowerCase().includes(term))
      );
      renderTable(filtered);
    });

    function exportCSV() {
      if (allLeads.length === 0) { alert('No leads to export'); return; }
      const headers = ["ID", "Timestamp", "Name", "Mobile", "Email", "Property Type", "Entrance", "Kitchen", "Bedroom", "Current Issue", "Vastu Score", "Paid ₹9"];
      const rows = allLeads.map(l => [
        `"${l.id || ''}"`,
        `"${l.timestamp || ''}"`,
        `"${(l.name || '').replace(/"/g, '""')}"`,
        `"${l.mobile || ''}"`,
        `"${(l.email || '').replace(/"/g, '""')}"`,
        `"${l.propertyType || ''}"`,
        `"${(l.answers?.entrance?.selection || '').replace(/"/g, '""')}"`,
        `"${(l.answers?.kitchen?.selection || '').replace(/"/g, '""')}"`,
        `"${(l.answers?.bedroom?.selection || '').replace(/"/g, '""')}"`,
        `"${(l.answers?.issue?.selection || '').replace(/"/g, '""')}"`,
        `"${l.totalScore || ''}"`,
        `"${l.paid ? 'YES' : 'NO'}"`
      ]);

      const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `call_astro_leads_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function copyJSON() {
      navigator.clipboard.writeText(JSON.stringify(allLeads, null, 2)).then(() => alert("Copied leads to clipboard!"));
    }

    function clearLeads() {
      if (confirm("Are you sure you want to delete all leads?")) {
        localStorage.removeItem(STORAGE_KEY);
        loadLeads();
      }
    }

    window.onload = loadLeads;
  </script>
</body>
</html>
